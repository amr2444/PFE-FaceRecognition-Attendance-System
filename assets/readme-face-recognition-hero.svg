<svg width="1400" height="520" viewBox="0 0 1400 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FACE RECOGNITION hero banner</title>
  <desc id="desc">Dark editorial banner for the Face Recognition attendance platform README.</desc>
  <defs>
    <linearGradient id="bgGlow" x1="220" y1="70" x2="1180" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B2430"/>
      <stop offset="1" stop-color="#141A23"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#263140" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="520" rx="26" fill="#0F141B"/>
  <rect x="20" y="20" width="1360" height="480" rx="18" fill="url(#bgGlow)"/>
  <rect x="20" y="20" width="1360" height="480" rx="18" fill="url(#grid)" opacity="0.22"/>
  <circle cx="1180" cy="120" r="180" fill="#1D4ED8" opacity="0.06"/>
  <circle cx="260" cy="400" r="200" fill="#16A34A" opacity="0.05"/>

  <g filter="url(#softShadow)">
    <text x="86" y="220" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="3" fill="none" stroke="#F97316" stroke-width="2.2">FACE</text>
    <text x="80" y="214" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="3" fill="none" stroke="#2563EB" stroke-width="2.2">FACE</text>
    <text x="74" y="208" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="3" fill="#F8FAFC">FACE</text>

    <text x="408" y="220" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="2" fill="none" stroke="#F97316" stroke-width="2.2">RECOGNITION</text>
    <text x="402" y="214" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="2" fill="none" stroke="#2563EB" stroke-width="2.2">RECOGNITION</text>
    <text x="396" y="208" font-size="118" font-family="Arial Black, Impact, sans-serif" font-weight="900" letter-spacing="2" fill="#F8FAFC">RECOGNITION</text>
  </g>

  <rect x="72" y="276" width="1256" height="2" fill="#313C4C"/>

  <text x="700" y="344" text-anchor="middle" font-size="26" font-family="Georgia, Times New Roman, serif" font-style="italic" fill="#F8E7CF">
    A full-stack attendance platform built for real-time recognition and HR supervision
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">
