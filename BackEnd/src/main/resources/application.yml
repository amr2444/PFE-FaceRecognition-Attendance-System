server:
  port: 8080

spring:
  application:
    name: dream-case-api
  profiles:
    default: ${SPRING_PROFILES_DEFAULT:dev}
  jpa:
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    validate-on-migrate: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  seed:
    local-h2:
      enabled: ${APP_LOCAL_H2_SEED_ENABLED:false}
  security:
    bootstrap-admin:
      enabled: false
      name: ${APP_ADMIN_NAME:Local Admin}
      email: ${APP_ADMIN_EMAIL:admin@local.case}
      password: ${APP_ADMIN_PASSWORD:}
    bootstrap-recognition-client:
      enabled: ${APP_BOOTSTRAP_RECOGNITION_CLIENT_ENABLED:false}
      name: ${APP_RECOGNITION_CLIENT_NAME:Face Recognition Client}
      email: ${APP_RECOGNITION_CLIENT_EMAIL:face-client@local.case}
      password: ${APP_RECOGNITION_CLIENT_PASSWORD:}
    surface:
      expose-h2-console-without-auth: false
      expose-swagger-without-auth: false
    jwt:
      secret: ${APP_JWT_SECRET:}
      expiration-ms: ${APP_JWT_EXPIRATION_MS:28800000}
